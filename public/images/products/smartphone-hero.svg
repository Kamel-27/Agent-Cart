<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bgGrad)"/>
  <g transform="translate(60, 40)">
    <!-- Phone Chassis -->
    <rect x="0" y="0" width="280" height="520" rx="36" fill="url(#bodyGrad)" stroke="#475569" stroke-width="4"/>
    <!-- Inner Screen Bezel -->
    <rect x="8" y="8" width="264" height="504" rx="28" fill="#020617"/>
    <!-- Screen Display -->
    <rect x="14" y="14" width="252" height="492" rx="22" fill="url(#screenGrad)"/>
    <!-- Dynamic Island / Punch Hole -->
    <ellipse cx="140" cy="30" rx="18" ry="6" fill="#020617"/>
    <!-- Abstract Screen Wallpaper Elements -->
    <circle cx="140" cy="260" r="80" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="8"/>
    <circle cx="140" cy="260" r="40" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"/>
    <text x="140" y="460" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">SMARTPHONE</text>
  </g>
</svg>
